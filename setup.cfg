[flake8]
max-line-length = 79
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    .pytest_cache,
    build,
    dist
ignore =
    # W503 — двоичный оператор в начале строки (можно и так, и так)
    W503,
    # E203 — пробел перед двоеточием в slice (несовместимо с PEP 8 от Black)
    E203
